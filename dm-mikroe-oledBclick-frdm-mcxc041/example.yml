i2c_interrupt_b2b_transfer_master:
  boards:
    frdmmcxc041: []
  contents:
    document:
      brief: The i2c_interrupt_b2b_transfer_master example shows how to use i2c driver
        as master to do board to board transfer with interrupt:In this example, one
        i2c instance as master and another i2c instance on the other board as slave.
        Master sends a piece of data to slave, and receive a piece of data from slave.
        This example checks if the data received from slave is correct.
      category: driver_examples/i2c
      example_readme:
      - examples/driver_examples/i2c/interrupt_b2b_transfer/master/readme.md
      - ${board_root}/${board}/driver_examples/i2c/interrupt_b2b_transfer/master/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
      name: i2c_interrupt_b2b_transfer_master${core_id_suffix_name}
    meta_path: examples/driver_examples/i2c/interrupt_b2b_transfer/master
    project-root-path: boards/${board}/driver_examples/i2c/interrupt_b2b_transfer/master/${multicore_foldername}
  section-type: freestanding_application
